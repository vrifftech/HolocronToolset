[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HolocronToolset"
version = "4.0.0b0"
description = "Standalone HolocronToolset frontend for the separately supplied audited PyKotor backend"
requires-python = ">=3.10"
dependencies = [
  "ply>=3.11,<4",
  "charset-normalizer>=2,<4",
  "defusedxml>=0.7,<1",
  "typing-extensions>=4.8",
  "requests>=2.27,<3",
  "PyQt5>=5.15,<6",
  "PyOpenGL>=3.1,<4",
  "PyGLM>=2.5,<3",
  "numpy>=1.26",
  "Pillow>=9.5",
  "watchdog>=2.1",
  "Markdown>=3.3",
  "jsmin>=3,<4",
  "pyperclip>=1.8,<2"
]
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Nicholas Hugi"}]

[project.scripts]
holocron-toolset = "toolset.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolset", "toolset.*"]
exclude = ["toolset.help*"]
namespaces = true

[tool.setuptools.package-data]
toolset = ["help/**/*", "help/*"]
